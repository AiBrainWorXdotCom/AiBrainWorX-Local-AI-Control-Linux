name: Linux source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Public-file privacy guard
        run: python3 -B tests/check_public_files.py
      - name: Native host, ownership and shared runtime tests
        run: bash Setup.sh
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Unreal inspection bridge contracts
        run: python3 -B bridge/test_unreal_mcp.py

      - name: Activity frontend contracts
        run: node tests/test_activity_frontend.cjs
